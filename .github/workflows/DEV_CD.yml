name: Dev_CD

on:
  push:
    branches:
      - chore/#18-layered-jar-build
      - develop

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      REGISTRY_URL: ${{ secrets.ECR_REGISTRY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle Build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: clean build
          cache-read-only: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        run: |
          docker build -t ${REGISTRY_URL}:dev .
          docker push ${REGISTRY_URL}:dev

  deploy:
    runs-on: dev
    needs : push
    env:
      IMAGE_NAME: ${{ secrets.ECR_REGISTRY_URL }}
      IMAGE_TAG: dev
      CONTAINER_NAME: iq-dev
    steps:
      - name: login to ecr
        run: |            
            echo "[1] 로그인 to ECR"
            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin ${IMAGE_NAME}

      - name: stop and remove exists container
        run: |
            echo "[2] 기존 컨테이너 중지 및 삭제"
            docker stop $CONTAINER_NAME 2>/dev/null || true
            docker rm $CONTAINER_NAME 2>/dev/null || true

      - name : image pull
        run: |
            echo "[3] 이미지 Pull: ${IMAGE_NAME}:${IMAGE_TAG}"
            docker pull ${IMAGE_NAME}:${IMAGE_TAG}

      - name : container run
        run: |
            echo "[4] 컨테이너 실행"
            docker run -d --name $CONTAINER_NAME \
              -p 8080:8080 \
              --restart unless-stopped \
              $IMAGE_NAME:$IMAGE_TAG

      - name: check container run
        run : |
          echo "[5] 컨테이너 실행 확인"
          docker ps
