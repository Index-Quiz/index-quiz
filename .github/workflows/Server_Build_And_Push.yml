name: Server Build & Push on Branch

on:
  push:
    branches:
      - chore/#18-layered-jar-build
      - develop

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      APP_DIR: indexquiz
      REGISTRY_URL: ${{ secrets.ECR_REGISTRY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Gradle Build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: clean build
          cache-read-only: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set safe tag
        id: vars
        run: echo "SAFE_TAG=${GITHUB_REF_NAME//\//-}" | tr -d '#' >> $GITHUB_ENV

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        run: |
          docker build -t ${REGISTRY_URL}/${APP_DIR}:${SAFE_TAG} .
          docker push ${REGISTRY_URL}/${APP_DIR}:${SAFE_TAG}
