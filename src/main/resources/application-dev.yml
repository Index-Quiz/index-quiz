spring:
  datasource:
    url: jdbc:mysql://db:3306/quiz?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  profiles:
    active: dev

discord:
  token: ${DISCORD_TOKEN}
  channel-id: ${DEV_DISCORD_CHANNEL_ID}

