            <a href="/" class="learn-home-btn">

        </div>

        <!-- 학습자료 헤더 -->

        </div>

            <div class="learn-loading">
                <div class="learn-spinner"></div>
                <span>학습자료를 불러오는 중...</span>

        <div id="ssrLearnContent" th:if="${material != null}">
            <article>
                <h2 th:text="${material.title()}">학습자료 제목</h2>
                <p th:text="${material.description()}">학습자료 설명</p>
                <div th:text="${material.content()}">학습자료 본문 내용</div>
            </article>
            <nav th:if="${materialsList != null and !materialsList.isEmpty()}">
                <h3>이 세트의 학습자료 목록</h3>
                <ul>
                    <li th:each="m : ${materialsList}">
                        <a th:href="'/learn?set=' + ${questionSet} + '&amp;id=' + ${m.id()}" th:text="${m.title()}">자료 제목</a>
                        <span th:text="' - ' + ${m.description()}"> - 설명</span>
                    </li>
                </ul>
            </nav>
            <p><a th:href="'/quiz?set=' + ${questionSet}">이 세트 퀴즈 풀기</a> | <a href="/">홈으로 돌아가기</a></p>

                <div class="seo-links">

                    <ul>
                        <li><a href="/learn?set=A">인덱스 기초 1 - 해쉬 인덱스, B-Tree</a></li>
                        <li><a href="/learn?set=B">인덱스 기초 2 - 클러스터링 인덱스, 내부 구조</a></li>
                        <li><a href="/learn?set=C">인덱스 활용 1 - 레인지 스캔, Left-Most</a></li>
                        <li><a href="/learn?set=D">인덱스 활용 2 - AND, OR, IN절</a></li>
                        <li><a href="/learn?set=E">인덱스 응용 1 - 복합 인덱스, 루스 스캔</a></li>
                        <li><a href="/learn?set=F">인덱스 응용 2 - 커버링 인덱스, 스킵 스캔</a></li>
                        <li><a href="/learn?set=G">인덱스 고급 1 - 정렬, ICP</a></li>
                        <li><a href="/learn?set=H">인덱스 고급 2 - 페이지 분할, 함수 인덱스, 인덱스 머지</a></li>
                    </ul>
                    <p><a href="/">홈으로 돌아가기</a></p>
                </div>
            </noscript>
