<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1875212521362490"
            crossorigin="anonymous"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PVP7YB17ET"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-PVP7YB17ET');
    </script>
    <meta charset="UTF-8">
    <meta name="naver-site-verification" content="a17c55cd81ff8e7b42414992e4e9679ee691df4e" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="'MySQL 인덱스 퀴즈 세트 ' + ${questionSet} + ' - 7개 문제를 풀고 해설과 함께 인덱스 개념을 학습하세요.'" content="MySQL 인덱스 퀴즈 - 7개 문제를 풀고 해설과 함께 인덱스 개념을 학습하세요.">
    <meta property="og:type" content="website">
    <meta property="og:title" th:content="'Index Quiz - 세트 ' + ${questionSet} + ' MySQL 인덱스 퀴즈'" content="Index Quiz - MySQL 인덱스 퀴즈">
    <meta property="og:description" content="7개 문제를 풀고 해설과 함께 인덱스 개념을 학습하세요. 실무에 필요한 MySQL 인덱스 지식을 테스트합니다.">
    <meta property="og:url" th:content="'https://index-quiz.com/quiz?set=' + ${questionSet}" content="https://index-quiz.com/quiz">
    <meta property="og:image" content="https://quiz-solution-images.s3.ap-northeast-2.amazonaws.com/index-quiz-logo.png">
    <meta property="og:site_name" content="Index Quiz">
    <meta property="og:locale" content="ko_KR">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" th:content="'Index Quiz - 세트 ' + ${questionSet} + ' MySQL 인덱스 퀴즈'" content="Index Quiz - MySQL 인덱스 퀴즈">
    <meta name="twitter:description" content="7개 문제를 풀고 해설과 함께 인덱스 개념을 학습하세요.">
    <link rel="canonical" th:href="'https://index-quiz.com/quiz?set=' + ${questionSet}" href="https://index-quiz.com/quiz">
    <title th:text="'Index Quiz - 세트 ' + ${questionSet} + ' 퀴즈'">DB 인덱스 퀴즈</title>
    <link rel="icon" type="image/png"
          href="https://quiz-solution-images.s3.ap-northeast-2.amazonaws.com/index-quiz-logo.png">
    <link rel="stylesheet" href="home-style.css">
    <link rel="stylesheet" href="style.css">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Quiz",
        "name": "MySQL 인덱스 퀴즈",
        "description": "MySQL 인덱스에 대한 이해도를 테스트하는 퀴즈입니다. 각 세트는 7개 문제로 구성되어 있으며, 해설과 함께 학습할 수 있습니다.",
        "educationalLevel": "intermediate",
        "inLanguage": "ko",
        "about": {
            "@type": "Thing",
            "name": "MySQL Database Index",
            "description": "B-Tree, 복합 인덱스, 커버링 인덱스, 클러스터링 인덱스 등 MySQL 인덱스 개념"
        },
        "provider": {
            "@type": "Organization",
            "name": "Index Quiz",
            "url": "https://index-quiz.com/"
        }
    }
    </script>
</head>
<body>

<div class="page-layout">

    <!-- 좌측 세로 배너 -->
    <aside class="side-ad side-ad-left">
        <ins class="kakao_ad_area" style="display:none;"
             data-ad-unit="DAN-9BZPqNA3dY8ZyMWn"
             data-ad-width="160"
             data-ad-height="600"></ins>
        <ins class="kakao_ad_area" style="display:none;"
             data-ad-unit="DAN-bSMUplcNPxLJN76G"
             data-ad-width="160"
             data-ad-height="600"></ins>
        <ins class="kakao_ad_area" style="display:none;"
             data-ad-unit="DAN-U4Jimb574B0515Wc"
             data-ad-width="160"
             data-ad-height="600"></ins>
    </aside>

    <div class="container">
        <!-- 홈으로 돌아가기 버튼 -->
        <div class="home-button-container">
            <a href="/" class="home-btn">
                <span class="home-icon">🏠</span>
                <span>홈으로</span>
            </a>
        </div>

        <!-- 헤더 섹션 -->
        <header>
            <div class="header-content">
                <div class="logo-wrapper">
                    <h1>Index Quiz</h1>
                </div>
                <p class="subtitle">MySQL 인덱스에 대한 지식을 테스트하고 향상시켜보세요!</p>
            </div>
        </header>

        <div class="quiz-container" id="quizContainer">
            <div class="quiz-header">
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <p class="question-number">
                    문제 <span id="currentQuestion">1</span> / <span id="totalQuestions" th:text="${#lists.size(quizData)}">7</span>
                </p>
            </div>

            <div class="question-container">
                <h2 id="questionText">질문이 여기에 표시됩니다...</h2>
                
                <div class="options" id="optionsContainer">
                    <!-- 선택지들이 동적으로 추가됩니다 -->
                </div>
                
                <button class="submit-btn" id="submitBtn" onclick="submitAnswer()">답 제출하기</button>
            </div>

            <div class="result-container" id="resultContainer" style="display: none;">
                <div class="result-message" id="resultMessage"></div>
                <div class="explanation" id="explanation">
                    <h3>💡 해설</h3>
                    <div class="explanation-content" id="explanationContent">
                        <!-- 해설 내용과 이미지가 여기에 표시됩니다 -->
                    </div>
                </div>
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">다음 문제</button>
            </div>
        </div>

        <!-- SSR: 크롤러가 읽을 수 있는 정적 퀴즈 콘텐츠 (JS 로딩 시 숨겨짐) -->
        <div id="ssrQuizContent" th:if="${questions != null and !questions.isEmpty()}">
            <h2 th:text="'MySQL 인덱스 퀴즈 - 세트 ' + ${questionSet}">MySQL 인덱스 퀴즈</h2>
            <p th:text="'총 ' + ${#lists.size(questions)} + '개 문제로 구성된 MySQL 인덱스 학습 퀴즈입니다.'">퀴즈 설명</p>
            <div th:each="question, iter : ${questions}">
                <h3 th:text="'문제 ' + ${iter.count} + '. ' + ${question.content()}">문제</h3>
                <ul>
                    <li th:each="option : ${question.options()}" th:text="${option.content()}">선택지</li>
                </ul>
            </div>
            <p><a href="/">다른 퀴즈 세트 보기</a></p>
        </div>

        <!-- 카카오 광고 -->
        <div class="ad-container">
            <ins class="kakao_ad_area ad-pc" style="display:none;"
                 data-ad-unit = "DAN-0R9ut1I8lSOs0qXH"
                 data-ad-width = "728"
                 data-ad-height = "90"></ins>

            <ins class="kakao_ad_area ad-mobile" style="display:none;"
                 data-ad-unit = "DAN-LBE37Ymv7zkT9bNL"
                 data-ad-width = "320"
                 data-ad-height = "100"></ins>
        </div>

        <div class="final-result" id="finalResult" style="display: none;">
            <h2>🎉 퀴즈 완료!</h2>
            <div class="score">
                <p>총 점수: <span id="finalScore">0</span> / <span id="finalTotal" th:text="${#lists.size(quizData)}">7</span></p>
                <p class="score-percentage" id="scorePercentage">0%</p>
            </div>
            <div class="score-stats" id="scoreStats" style="display: none;">
                <h3 class="stats-title">점수 분포</h3>
                <div class="histogram" id="histogram"></div>
                <div class="stats-summary">
                    <div class="stat-item">
                        <span class="stat-label">평균 점수</span>
                        <span class="stat-value" id="avgScore">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">당신의 위치</span>
                        <span class="stat-value" id="topPercent">-</span>
                    </div>
                </div>
            </div>
            <div class="final-buttons">
                <button class="restart-btn" onclick="restartQuiz()">다시 시작</button>
                <a id="learnBtn" class="learn-link-btn" style="display: none;">학습자료 보기</a>
                <a href="/" class="home-return-btn">홈으로 돌아가기</a>
            </div>
        </div>
    </div>

    <!-- 우측 세로 배너 -->
    <aside class="side-ad side-ad-right">
        <ins class="kakao_ad_area" style="display:none;"
             data-ad-unit="DAN-ASH32CKGGQU02Dq1"
             data-ad-width="160"
             data-ad-height="600"></ins>
        <ins class="kakao_ad_area" style="display:none;"
             data-ad-unit="DAN-Z30A837UZGYDPYEC"
             data-ad-width="160"
             data-ad-height="600"></ins>
        <ins class="kakao_ad_area" style="display:none;"
             data-ad-unit="DAN-086w8yz7cOcSRFhb"
             data-ad-width="160"
             data-ad-height="600"></ins>
    </aside>

</div>
<!-- Thymeleaf로 퀴즈 데이터 전달 (fallback 데이터 포함) -->
<script th:inline="javascript">
    // 서버에서 전달받은 퀴즈 데이터 (없으면 기본 데이터 사용)
    const serverQuizData = /*[[${quizData}]]*/ null;

    // 실제 사용할 퀴즈 데이터 결정 (서버 데이터 우선, 없으면 기본 데이터)
    const quizData = serverQuizData;

    // 개발자 도구에서 데이터 소스 확인 가능
    console.log('퀴즈 데이터 소스:', serverQuizData ? '서버에서 전달받음' : '기본 예시 데이터 사용');
</script>
<script>
    // JS가 로드되면 SSR 콘텐츠를 숨기고 인터랙티브 퀴즈를 표시
    (function() {
        var ssrContent = document.getElementById('ssrQuizContent');
        if (ssrContent) ssrContent.style.display = 'none';
    })();
</script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="markdown-parser.js"></script>
<script src="script.js"></script>
<script type="text/javascript" src="//t1.daumcdn.net/kas/static/ba.min.js" async></script>
</body>
</html>
