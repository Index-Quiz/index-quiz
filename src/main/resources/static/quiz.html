<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PVP7YB17ET"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-PVP7YB17ET');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB 인덱스 퀴즈</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 홈으로 돌아가기 버튼 -->
        <div class="home-button-container">
            <a href="index.html" class="home-btn">
                <span class="home-icon">🏠</span>
                <span>홈으로</span>
            </a>
        </div>

        <header>
            <h1>🗃️ DB 인덱스 퀴즈</h1>
            <p>데이터베이스 인덱스에 대한 지식을 테스트해보세요!</p>
        </header>

        <div class="quiz-container" id="quizContainer">
            <div class="quiz-header">
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <p class="question-number">
                    문제 <span id="currentQuestion">1</span> / <span id="totalQuestions" th:text="${#lists.size(quizData)}">10</span>
                </p>
            </div>

            <div class="question-container">
                <h2 id="questionText">질문이 여기에 표시됩니다...</h2>
                
                <div class="options" id="optionsContainer">
                    <!-- 선택지들이 동적으로 추가됩니다 -->
                </div>
                
                <button class="submit-btn" id="submitBtn" onclick="submitAnswer()">답 제출하기</button>
            </div>

            <div class="result-container" id="resultContainer" style="display: none;">
                <div class="result-message" id="resultMessage"></div>
                <div class="explanation" id="explanation">
                    <h3>💡 해설</h3>
                    <div class="explanation-content" id="explanationContent">
                        <!-- 해설 내용과 이미지가 여기에 표시됩니다 -->
                    </div>
                </div>
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">다음 문제</button>
            </div>
        </div>

        <div class="final-result" id="finalResult" style="display: none;">
            <h2>🎉 퀴즈 완료!</h2>
            <div class="score">
                <p>총 점수: <span id="finalScore">0</span> / <span id="finalTotal" th:text="${#lists.size(quizData)}">10</span></p>
                <p class="score-percentage" id="scorePercentage">0%</p>
            </div>
            <div class="final-buttons">
                <button class="restart-btn" onclick="restartQuiz()">다시 시작</button>
                <a href="index.html" class="home-return-btn">홈으로 돌아가기</a>
            </div>
        </div>
    </div>

    <!-- Thymeleaf로 퀴즈 데이터 전달 (fallback 데이터 포함) -->
    <script th:inline="javascript">
        // 서버에서 전달받은 퀴즈 데이터 (없으면 기본 데이터 사용)
        const serverQuizData = /*[[${quizData}]]*/ null;
        
        // 기본 예시 퀴즈 데이터 (서버 데이터가 없을 때 사용)
        const defaultQuizData = [
            {
                question: "데이터베이스 인덱스의 주요 목적은 무엇입니까?",
                options: [
                    "데이터의 저장 공간을 줄이기 위해서",
                    "쿼리의 검색 속도를 향상시키기 위해서",
                    "데이터의 보안을 강화하기 위해서",
                    "데이터베이스의 백업을 용이하게 하기 위해서"
                ],
                correct: 1,
                explanation: "인덱스의 주요 목적은 쿼리의 검색 속도를 향상시키는 것입니다. 인덱스는 테이블의 특정 컬럼에 대한 빠른 접근 경로를 제공하여 데이터 검색 시간을 단축시킵니다.",
                explanationImage: null
            },
            {
                question: "B-Tree 인덱스의 특징으로 올바른 것은?",
                options: [
                    "모든 리프 노드가 같은 레벨에 위치한다",
                    "범위 검색에 적합하지 않다",
                    "삽입과 삭제 시 트리의 균형이 유지되지 않는다"
                ],
                correct: 0,
                explanation: "B-Tree 인덱스는 균형 트리 구조로, 모든 리프 노드가 같은 레벨에 위치합니다. 이는 모든 검색 경로의 길이가 동일함을 보장하여 일관된 성능을 제공합니다.",
                explanationImage: "/images/btree-structure.png"
            },
            {
                question: "다음 중 인덱스를 생성하면 성능 향상을 기대할 수 있는 경우는?",
                options: [
                    "WHERE 절에서 자주 사용되는 컬럼",
                    "ORDER BY 절에서 자주 사용되는 컬럼",
                    "JOIN 조건에서 자주 사용되는 컬럼",
                    "위의 모든 경우"
                ],
                correct: 3,
                explanation: "WHERE, ORDER BY, JOIN 조건에서 자주 사용되는 컬럼들은 모두 인덱스를 생성했을 때 성능 향상을 기대할 수 있습니다. 이러한 절들은 데이터 접근 패턴을 결정하기 때문입니다.",
                explanationImage: "/images/index-performance.png"
            },
            {
                question: "클러스터드 인덱스(Clustered Index)의 특징은?",
                options: [
                    "테이블당 여러 개 생성할 수 있다",
                    "실제 데이터의 물리적 순서를 결정한다",
                    "별도의 저장 공간이 필요하다"
                ],
                correct: 1,
                explanation: "클러스터드 인덱스는 실제 데이터의 물리적 순서를 결정합니다. 테이블당 하나만 생성할 수 있으며, 데이터 페이지 자체가 인덱스의 리프 노드 역할을 합니다.",
                explanationImage: "/images/clustered-index.png"
            },
            {
                question: "다음 중 인덱스 사용을 방해하는 WHERE 조건은?",
                options: [
                    "WHERE age = 25",
                    "WHERE name LIKE 'John%'",
                    "WHERE UPPER(name) = 'JOHN'",
                    "WHERE age BETWEEN 20 AND 30"
                ],
                correct: 2,
                explanation: "WHERE UPPER(name) = 'JOHN'과 같이 컬럼에 함수를 적용하면 인덱스 사용이 방해됩니다. 옵티마이저가 함수 결과를 예측할 수 없어 인덱스 스캔 대신 풀 테이블 스캔을 수행할 가능성이 높습니다.",
                explanationImage: null
            },
            {
                question: "복합 인덱스(Composite Index)에서 컬럼 순서가 중요한 이유는?",
                options: [
                    "저장 공간을 절약하기 위해서",
                    "인덱스 스캔의 효율성을 높이기 위해서",
                    "데이터 타입 호환성을 위해서",
                    "백업 속도를 향상시키기 위해서"
                ],
                correct: 1,
                explanation: "복합 인덱스에서 컬럼 순서는 인덱스 스캔의 효율성에 직접적인 영향을 미칩니다. 선택도가 높은 컬럼을 앞에 배치하면 더 효율적인 검색이 가능합니다.",
                explanationImage: "/images/composite-index.png"
            },
            {
                question: "인덱스의 단점으로 올바른 것은?",
                options: [
                    "추가적인 저장 공간이 필요하다",
                    "INSERT, UPDATE, DELETE 작업이 느려질 수 있다",
                    "인덱스 유지 관리 비용이 발생한다",
                    "위의 모든 것"
                ],
                correct: 3,
                explanation: "인덱스는 추가 저장 공간을 필요로 하고, 데이터 변경 시 인덱스도 함께 갱신되어야 하므로 DML 작업이 느려질 수 있으며, 지속적인 유지 관리가 필요합니다.",
                explanationImage: null
            },
            {
                question: "해시 인덱스(Hash Index)의 특징은?",
                options: [
                    "범위 검색에 매우 효율적이다",
                    "등등 비교(=) 검색에 매우 빠르다",
                    "ORDER BY 절에서 정렬을 피할 수 있다",
                    "B-Tree보다 저장 공간을 많이 사용한다"
                ],
                correct: 1,
                explanation: "해시 인덱스는 등등 비교(=) 검색에서 O(1)의 시간복잡도로 매우 빠른 성능을 제공합니다. 하지만 범위 검색이나 정렬에는 적합하지 않습니다.",
                explanationImage: "/images/hash-index.png"
            },
            {
                question: "다음 중 인덱스 힌트(Index Hint)를 사용하는 이유는?",
                options: [
                    "옵티마이저의 잘못된 실행 계획을 수정하기 위해",
                    "인덱스 생성 속도를 높이기 위해",
                    "메모리 사용량을 줄이기 위해"
                ],
                correct: 0,
                explanation: "인덱스 힌트는 옵티마이저가 잘못된 실행 계획을 선택했을 때, 개발자가 직접 사용할 인덱스를 지정하여 성능을 개선하기 위해 사용됩니다.",
                explanationImage: null
            },
            {
                question: "인덱스 스캔 방식 중 'Index Full Scan'의 특징은?",
                options: [
                    "인덱스의 루트에서 리프까지만 스캔한다",
                    "인덱스의 모든 리프 블록을 순차적으로 읽는다",
                    "특정 키 값만을 찾아서 스캔한다",
                    "인덱스를 역순으로 스캔한다"
                ],
                correct: 1,
                explanation: "Index Full Scan은 인덱스의 모든 리프 블록을 순차적으로 읽는 방식입니다. 주로 인덱스에 포함된 모든 컬럼이 SELECT나 WHERE 절에서 사용될 때 발생합니다.",
                explanationImage: "/images/index-scan-types.png"
            }
        ];
        
        // 실제 사용할 퀴즈 데이터 결정 (서버 데이터 우선, 없으면 기본 데이터)
        const quizData = serverQuizData && serverQuizData.length > 0 ? serverQuizData : defaultQuizData;
        
        // 개발자 도구에서 데이터 소스 확인 가능
        console.log('퀴즈 데이터 소스:', serverQuizData ? '서버에서 전달받음' : '기본 예시 데이터 사용');
        console.log('퀴즈 문제 수:', quizData.length);
    </script>
    <script src="script.js"></script>
</body>
</html>
