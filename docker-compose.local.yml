version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indexquiz-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/indexquiz?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: indexquiz_user
      SPRING_DATASOURCE_PASSWORD: indexquiz_pass
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: indexquiz-db
    restart: always
    environment:
      MYSQL_DATABASE: indexquiz
      MYSQL_USER: indexquiz_user
      MYSQL_PASSWORD: indexquiz_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db_data:
